<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
            padding: 0;
            margin: 0;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Title Box Overlay */
        .map-title-box {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 22px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            border: 1px solid rgba(0,0,0,0.15);
            text-align: center;
        }
        .map-title-box h2 {
            margin: 0;
            font-size: 18px;
            color: #1a252f;
            font-weight: bold;
        }

        /* North Arrow Box Overlay */
        .north-arrow-box {
            position: absolute;
            top: 15px;
            right: 65px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 1px solid rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .north-arrow-box svg {
            width: 26px;
            height: 26px;
        }
        .north-arrow-box span {
            font-size: 10px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Zoom Control Overlay */
        .ol-zoom {
            top: 15px !important;
            left: 15px !important;
            z-index: 1000 !important;
        }
        .ol-zoom button {
            background-color: #2c3e50 !important;
            color: #ffffff !important;
            border-radius: 4px !important;
        }

        /* Layer Switcher / Index Overlay */
        .layer-switcher {
            top: 15px !important;
            right: 15px !important;
            z-index: 1000 !important;
        }
        </style>
        <title>Karvir Taluka Map</title>
    </head>
    <body>
        <!-- Header Title -->
        <div class="map-title-box">
            <h2>KARVIR TALUKA MAP</h2>
        </div>

        <!-- SVG North Arrow -->
        <div class="north-arrow-box">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,5 20,90 50,70" fill="#2c3e50"/>
                <polygon points="50,5 80,90 50,70" fill="#e74c3c"/>
            </svg>
            <span>N</span>
        </div>

        <!-- Map Container -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/polyglot.min.js"></script>
        <script src="resources/ol.js"></script>
        <script src="resources/ol-layerswitcher.js"></script>
        <script src="layers/karvir_clipclipped_2.js"></script>
        <script src="styles/karvir_clipclipped_2_style.js"></script>

        <script>
        var container = document.getElementById('popup');
        var content = document.getElementById('popup-content');
        var closer = document.getElementById('popup-closer');

        closer.onclick = function() {
            overlay.setPosition(undefined);
            closer.blur();
            return false;
        };

        var overlay = new ol.Overlay({
            element: container,
            autoPan: true,
            autoPanAnimation: { duration: 250 }
        });

        /* Base Layer: OpenStreetMap */
        var baseOsmLayer = new ol.layer.Tile({
            title: 'OpenStreetMap',
            type: 'base',
            visible: true,
            source: new ol.source.OSM()
        });

        /* Map Setup */
        var map = new ol.Map({
            target: 'map',
            overlays: [overlay],
            layers: [baseOsmLayer],
            view: new ol.View({
                center: ol.proj.fromLonLat([74.20, 16.65]),
                zoom: 11
            })
        });

        /* Karvir Taluka Vector Layer Loading */
        if (typeof json_karvir_clipclipped_2 !== 'undefined') {
            var format_karvir_clipclipped_2 = new ol.format.GeoJSON();
            var features_karvir_clipclipped_2 = format_karvir_clipclipped_2.readFeatures(json_karvir_clipclipped_2, {
                dataProjection: 'EPSG:4326',
                featureProjection: 'EPSG:3857'
            });
            var jsonSource_karvir_clipclipped_2 = new ol.source.Vector({
                features: features_karvir_clipclipped_2,
            });
            var layer_karvir_clipclipped_2 = new ol.layer.Vector({
                declutter: true,
                source: jsonSource_karvir_clipclipped_2,
                style: style_karvir_clipclipped_2,
                title: 'Karvir Taluka Boundary'
            });
            map.addLayer(layer_karvir_clipclipped_2);
            map.getView().fit(jsonSource_karvir_clipclipped_2.getExtent(), { duration: 1000 });
        }

        /* Index / Layer Switcher Control */
        var layerSwitcher = new ol.control.LayerSwitcher({
            activationMode: 'click',
            startActive: false,
            tipLabel: 'Layers Index',
            collapseTipLabel: 'Close Index'
        });
        map.addControl(layerSwitcher);
        </script>
    </body>
</html>
